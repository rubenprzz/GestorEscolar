version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: GestorAlumnosDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d 
    networks:
      - pg_network

  adminer:
    image: adminer
    container_name: adminer_container
    restart: always
    ports:
    - "8082:8080"  # cualquier puerto libre, por ejemplo 8082
    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
